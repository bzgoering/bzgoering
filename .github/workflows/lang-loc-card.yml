name: Lang LOC Card

on:
  schedule:
    - cron: "0 6 * * *"   # once a day, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tokei
        uses: taiki-e/install-action@v2
        with:
          tool: tokei

      - name: Verify tokei
        run: tokei --version

      - name: Install python deps
        run: pip install requests

      - name: Generate LOC-per-language card
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_loc_card.py

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/lang-loc-card.svg
          git diff --staged --quiet || git commit -m "Update lang LOC card"
          git push
